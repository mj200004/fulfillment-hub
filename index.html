<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fulfillment Hub</title>
<style>
:root{--ink:#111827;--mut:#5b6472;--line:#e3e6eb;--bg:#f5f6f8;--ok:#166534;--okbg:#dcfce7;--am:#92400e;--ambg:#fef3c7;--red:#991b1b;--redbg:#fee2e2;--rad:12px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h2,h3,h4{margin:0}
.mut{color:var(--mut);font-size:14px}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px}
.brand{font-weight:800;font-size:18px}
.seg{display:inline-flex;background:#eceff3;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 20px;border-radius:999px;font-weight:700;color:var(--mut);min-height:42px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.demo{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--mut)}
.btn{border:1px solid #c9ced6;background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;min-height:42px}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
main.office{padding:16px;max-width:1600px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;text-align:left}
.tile b{display:block;font-size:30px;line-height:1.1}
.tile span{font-size:14px;color:var(--mut)}
.tile.am{background:var(--ambg);border-color:#f3d28a}.tile.am b{color:var(--am)}
.tile.rd{background:var(--redbg);border-color:#f2b4b4}.tile.rd b{color:var(--red)}
.tile.on{outline:3px solid var(--ink)}
.sec{margin-top:18px}
.sec>h2{font-size:17px;margin-bottom:8px}
.alerts{display:grid;gap:6px}
.alert{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);border-left:5px solid;background:#fff;border-radius:10px;padding:8px 12px}
.alert.l2{border-left-color:#dc2626}.alert.l1{border-left-color:#d97706}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fchip{border:1px solid #c9ced6;background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;min-height:38px}
.fchip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(235px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#eceff3;border-radius:var(--rad);padding:10px;min-height:120px}
.col h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;margin-bottom:10px}
.colbody{max-height:72vh;overflow-y:auto}
.card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card.l0{border-left-color:#16a34a}.card.l1{border-left-color:#d97706}.card.l2{border-left-color:#dc2626}.card.sh{border-left-color:#9ca3af}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.badge{background:var(--ink);color:#fff;font-size:11px;font-weight:800;letter-spacing:.05em;border-radius:6px;padding:2px 7px}
.lv{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.lv0{background:var(--okbg);color:var(--ok)}.lv1{background:var(--ambg);color:var(--am)}.lv2{background:var(--redbg);color:var(--red)}
.dl{font-weight:700;font-size:14px;margin-top:4px}.dl.am{color:var(--am)}.dl.red{color:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:#eceff3}
.tag.am{background:var(--ambg);color:var(--am)}.tag.red{background:var(--redbg);color:var(--red)}
form.inl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
form.inl input[type=text]{flex:1;min-width:180px}
input[type=text],select{border:1px solid #c9ced6;border-radius:10px;padding:8px 10px;min-height:42px;background:#fff}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.iss{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;justify-items:start}
.iss.done{opacity:.8}
.chip{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}.chip.ok{background:var(--okbg);color:var(--ok)}
.lnk{border:0;background:none;padding:0;text-decoration:underline;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:30;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow-y:auto}
.panel{background:#fff;border-radius:16px;width:100%;max-width:680px;padding:18px}
.ph{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.panel h3{font-size:15px;margin:16px 0 6px}
.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0}
.note{border-radius:8px;padding:6px 10px;margin:4px 0;font-weight:600;font-size:14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.opt[aria-pressed=true]{border-color:var(--ink)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
/* Warehouse */
.wh{max-width:560px;margin:0 auto;padding:12px 14px 120px}
.task{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:18px}
.ttype{font-size:15px;letter-spacing:.1em;font-weight:800}
.oid{color:var(--mut);font-size:18px;margin-top:2px}
.banner{border-radius:12px;padding:10px 12px;font-weight:800;margin:12px 0;font-size:17px;border:2px solid var(--ink)}
.banner.am{background:var(--ambg);color:var(--am);border-color:#d97706}
.banner.rd{background:var(--redbg);color:var(--red);border-color:#dc2626}
.big{font-size:26px;line-height:1.25;margin:12px 0}
.bigbtn{width:100%;min-height:76px;font-size:23px;font-weight:800;border-radius:16px;border:0;background:var(--ink);color:#fff;margin-top:16px}
.bigbtn.light{background:#fff;color:var(--red)}
.route{display:grid;gap:8px;margin:12px 0}
.route>div{border:2px solid var(--line);border-radius:14px;padding:12px;font-size:22px}
.route small,.shelf small{display:block;font-size:13px;letter-spacing:.08em;color:var(--mut);font-weight:700}
.items{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.items li{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.shelf{font-size:36px;font-weight:800;min-width:84px;text-align:center}
.nm{font-size:22px;font-weight:700}.sp{font-size:19px}.sk{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:19px}
.prog{font-weight:700;color:var(--mut);margin-top:8px}
.item{border:2px solid var(--ink);border-radius:14px;padding:12px;margin:8px 0}
.q{font-size:20px;margin:14px 0 8px}
.choices{display:grid;gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:72px;border:2px solid #9aa3af;background:#fff;border-radius:14px;padding:10px 14px;text-align:left;font-size:17px}
.scanf{margin-top:14px}.scanf label{font-weight:700;display:block;margin-bottom:6px}
.scanrow{display:flex;gap:8px}.scanrow input{flex:1;font-size:20px;min-height:56px}.scanrow .btn{min-height:56px;font-size:18px}
.lane{font-size:48px;font-weight:800;margin:6px 0}
.next{margin:12px 4px;color:var(--mut)}
.reportbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;z-index:45}
.reportbar button{display:block;width:100%;max-width:560px;margin:0 auto;min-height:60px;border:2px solid var(--ink);background:#fff;border-radius:14px;font-size:20px;font-weight:800}
.sheet{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 14px 22px}
.sheet h3{font-size:22px;margin-bottom:10px}
.sheet .bigbtn{margin-top:8px;min-height:64px;font-size:20px}
.sheet .bigbtn.plain{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.wrong{position:fixed;inset:0;background:#b91c1c;color:#fff;z-index:40;overflow-y:auto;padding:20px 16px 130px}
.wx{max-width:560px;margin:0 auto}
.wt{font-size:44px;font-weight:900;line-height:1}
.ws{font-size:26px;font-weight:800;margin:6px 0 14px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp h4{font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.f{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;margin-bottom:6px}
.f small{display:block;font-size:12px;opacity:.9}.f b{font-size:18px;word-break:break-word}
.f.d{background:#fff;color:var(--red)}.f i{font-style:normal;font-size:12px;font-weight:700}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:70;display:none;max-width:90vw;text-align:center}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}.demo{margin-left:0}.cmp{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const MIN=60000;
const STAGES=['Received','Processed','Picking','Packing','Staged','Shipped'];
const LIMIT=[30,20,30,30,0,0];            // minutes allowed per stage (regular orders)
const PRIO_FACTOR=0.5, AMBER_FRAC=0.75;   // priority orders get half the time; amber at 75% of limit
const BUFFER=30, AMBER_SHIPBY=60;         // ship-by = pickup minus 30 min; amber when < 60 min left
const ISSUE_TYPES=['Wrong item','Missing stock','Damaged item','Box misplaced','Courier missed pickup','Other'];
const REPORT_TYPES=[['Wrong item','Wrong item'],['Item not on the shelf','Missing stock'],['Item is damaged','Damaged item'],["Can't find a box",'Box misplaced'],['Something else','Other']];

const COURIERS=[
 {id:'C1',name:'SwiftShip',cost:140,days:1,speed:'Next-day delivery',h:14,m:0,lane:'Lane 1'},
 {id:'C2',name:'QuickBox',cost:95,days:2,speed:'2-day delivery',h:16,m:0,lane:'Lane 2'},
 {id:'C3',name:'EcoPost',cost:60,days:4,speed:'4-day delivery',h:18,m:0,lane:'Lane 3'}
];
const CMAP={};COURIERS.forEach(c=>CMAP[c.id]=c);

const COLORS={BLK:'Black',NVY:'Navy',WHT:'White',GRY:'Grey',CHR:'Charcoal',OLV:'Olive',RED:'Red',BLU:'Blue',TAN:'Tan'};
const PRODUCTS=[
 ['TEE','Classic Tee',['BLK-M','NVY-M','BLK-L','WHT-M']],
 ['HOD','Zip Hoodie',['GRY-L','CHR-L','GRY-M']],
 ['JNS','Slim Jeans',['BLU-32','BLU-34','BLK-32']],
 ['CAP','Baseball Cap',['BLK-OS','NVY-OS']],
 ['SOC','Sport Socks 3-pack',['WHT-M','WHT-L']],
 ['BAG','Day Backpack',['BLK-OS','OLV-OS']],
 ['BTL','Steel Bottle 750ml',['BLK-OS','BLU-OS']],
 ['SHO','Runner Shoes',['BLK-9','BLK-10','WHT-9']],
 ['JKT','Rain Jacket',['OLV-M','OLV-L']],
 ['BLT','Leather Belt',['BLK-M','TAN-M']],
 ['WLT','Slim Wallet',['BLK-OS','TAN-OS']],
 ['SCF','Wool Scarf',['RED-OS','GRY-OS']],
 ['GLV','Touch Gloves',['BLK-M','BLK-L']],
 ['SHT','Oxford Shirt',['WHT-M','BLU-M','WHT-L']],
 ['SHR','Chino Shorts',['TAN-32','OLV-32']],
 ['BNI','Beanie',['BLK-OS','GRY-OS']],
 ['TOW','Gym Towel',['GRY-OS','BLU-OS']],
 ['PCH','Phone Pouch',['BLK-OS','RED-OS']]
];
const VL=[],V={};
PRODUCTS.forEach(p=>p[2].forEach(x=>{const a=x.split('-');const v={sku:p[0]+'-'+x,code:p[0],name:p[1],color:COLORS[a[0]],size:a[1]==='OS'?'One size':a[1]};VL.push(v);V[v.sku]=v;}));
const MAINLOCS=[];['A','B','C','D'].forEach(r=>[1,2,3,4].forEach(n=>MAINLOCS.push(r+n)));
const WH2LOCS=[];['X','Y','Z'].forEach(r=>[1,2,3].forEach(n=>WH2LOCS.push(r+n)));

// id, priority, courier index (-1 none), stage, minutes in stage, minutes since received, lines
const SEED=[
['1001',0,-1,0,8,8,'TEE-BLK-L:1'],
['1002',1,-1,0,12,12,'SHO-BLK-10:1'],
['1003',0,-1,0,25,25,'JNS-BLU-32:1,BLT-BLK-M:1'],
['1004',0,-1,0,41,41,'CAP-NVY-OS:2'],
['1005',0,-1,0,5,5,'SCF-RED-OS:1'],
['1006',0,-1,0,15,15,'WLT-BLK-OS:1,PCH-BLK-OS:1'],
['1007',1,1,1,6,40,'JKT-OLV-L:1,TEE-NVY-M:1'],   // (b) item only in warehouse 2 + look-alike
['1008',0,2,1,6,30,'HOD-GRY-M:1'],
['1009',0,1,1,9,35,'BAG-OLV-OS:1'],
['1010',0,2,1,18,45,'SHT-BLU-M:1,SOC-WHT-L:1'],
['1011',1,2,1,4,20,'BNI-BLK-OS:2'],
['1012',0,1,1,11,38,'SHO-WHT-9:1,SOC-WHT-M:1'],  // (c) out of stock everywhere
['1013',0,2,1,3,25,'TOW-BLU-OS:1'],
['1014',0,2,2,12,50,'JNS-BLU-34:1'],
['1015',1,1,2,9,30,'GLV-BLK-L:1,SCF-GRY-OS:1'],
['1016',0,2,2,20,60,'PCH-RED-OS:1'],
['1017',0,1,2,5,30,'SHR-OLV-32:1'],
['1018',1,1,3,7,25,'TEE-BLK-M:1,HOD-GRY-L:1'],   // (a) priority near cutoff + (f) look-alikes
['1019',0,2,3,70,130,'SHT-WHT-L:1'],            // (d) stuck in Packing
['1020',0,2,3,10,40,'BTL-BLU-OS:2'],
['1021',0,1,3,24,60,'BLT-TAN-M:1,WLT-TAN-OS:1'],
['1022',1,2,3,3,30,'CAP-BLK-OS:1'],
['1023',0,0,4,85,150,'SHR-TAN-32:1'],           // (e) staged, pickup missed
['1024',0,1,4,20,70,'TOW-GRY-OS:2'],
['1025',1,1,4,4,45,'BNI-GRY-OS:1'],
['1026',0,2,4,35,90,'BAG-BLK-OS:1'],
['1027',0,2,4,50,110,'BTL-BLK-OS:1'],
['1028',1,0,5,95,300,'TEE-WHT-M:2'],
['1029',0,0,5,110,320,'JNS-BLK-32:1'],
['1030',1,1,5,40,180,'GLV-BLK-M:1'],
['1031',0,2,5,130,350,'TOW-GRY-OS:1,TOW-BLU-OS:1'],
['1032',0,0,5,75,260,'CAP-BLK-OS:1'],
['1033',0,1,5,150,300,'HOD-CHR-L:1'],
['1034',0,0,5,200,400,'SOC-WHT-M:3'],
['1035',0,2,5,240,420,'SHT-WHT-M:1']
];

let S;
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now()+S.offset;
const pad=n=>String(n).padStart(2,'0');
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const pickupLabel=t=>(sameDay(t,now())?'':'tomorrow ')+hhmm(t);
function fmtMin(m){m=Math.max(0,Math.round(m));if(m<60)return m+' min';return Math.floor(m/60)+' h '+pad(m%60)+' min';}
const ago=t=>fmtMin((now()-t)/MIN)+' ago';
function atTime(h,m){const d=new Date(now());d.setHours(h,m,0,0);return d.getTime();}
function nextPickup(c){let p=atTime(c.h,c.m);if(p-BUFFER*MIN<=now())p+=24*60*MIN;return p;}
const byId=id=>S.orders.find(o=>o.id===id);
const cour=o=>o.courier?CMAP[o.courier]:null;
const shipBy=o=>o.pickupAt?o.pickupAt-BUFFER*MIN:null;
const pendingMoves=o=>S.moves.filter(m=>m.orderId===o.id&&!m.done);

/* ---------- state ---------- */
function newUI(view){return{view:view||'office',filter:'all',modal:null,mode:null,pick:null,
 form:{orderId:'',type:ISSUE_TYPES[0],note:''},mform:{type:ISSUE_TYPES[0],note:''},iss:{status:'open',type:'all'},scan:'',report:false};}
function init(view){
 S={offset:0,stock:{},orders:[],moves:[],moveSeq:0,issues:[],issueSeq:0,lock:null,wrong:null,scrollTo:null,ui:newUI(view)};
 const d=new Date();d.setHours(15,12,0,0);S.offset=d.getTime()-Date.now();   // demo clock starts at 15:12
 VL.forEach((v,i)=>{S.stock[v.sku]={main:4+(i*3)%9,mainLoc:MAINLOCS[i%16],wh2:(i*5)%7,wh2Loc:WH2LOCS[i%9]};});
 S.stock['JKT-OLV-L'].main=0;S.stock['JKT-OLV-L'].wh2=6;   // only in warehouse 2
 S.stock['SHO-WHT-9'].main=0;S.stock['SHO-WHT-9'].wh2=0;   // nowhere
 const t=now();
 SEED.forEach(r=>{
  const since=t-r[4]*MIN,created=t-r[5]*MIN,st=r[3],hist=[];
  for(let k=0;k<=st;k++)hist.push({stage:k,at:k===st?since:created+(since-created)*k/st});
  const c=r[2]>=0?COURIERS[r[2]]:null;
  S.orders.push({id:'ORD-'+r[0],priority:!!r[1],courier:c?c.id:null,pickupAt:c?atTime(c.h,c.m):null,stage:st,stageSince:since,createdAt:st?created:since,
   lines:r[6].split(',').map(x=>{const a=x.split(':');return{sku:a[0],qty:+a[1]};}),history:hist,blocked:null,checked:false,packed:{},packedDone:false});
 });
 S.issues.push({id:'I-'+(++S.issueSeq),orderId:'ORD-1029',type:'Damaged item',note:'Box corner crushed. Repacked.',by:'Warehouse',at:t-300*MIN,status:'resolved',resBy:'Office',resAt:t-270*MIN});
 S.issues.push({id:'I-'+(++S.issueSeq),orderId:'ORD-1008',type:'Missing stock',note:'Zip Hoodie Grey M: shelf B3 says 6, only 4 found. Needs a recount.',by:'Warehouse',at:t-95*MIN,status:'open'});
 normalize();
}
function normalize(){S.orders.filter(o=>o.stage===1&&!o.checked).forEach(stockCheck);}
function go(o,stage){o.stage=stage;o.stageSince=now();o.history.push({stage:stage,at:o.stageSince});}
function addIssue(x){S.issues.push({id:'I-'+(++S.issueSeq),orderId:x.orderId||null,type:x.type,note:x.note||'',by:x.by,at:now(),status:'open'});}

/* ---------- stock check (runs when an order is Processed and again when picking starts) ---------- */
function stockCheck(o){
 const bad=[],need=[];
 o.lines.forEach(l=>{const s=S.stock[l.sku],v=V[l.sku];
  if(s.main>=l.qty)return;
  if(s.main+s.wh2>=l.qty)need.push({sku:l.sku,qty:l.qty-s.main});
  else bad.push(v.name+' '+v.color+' '+v.size+' ('+l.sku+')');});
 o.checked=true;
 if(bad.length){o.blocked='No stock anywhere: '+bad.join('; ');return 'blocked';}
 o.blocked=null;let made=0;
 need.forEach(n=>{if(!S.moves.some(m=>m.orderId===o.id&&m.sku===n.sku&&!m.done)){
  S.moves.push({id:'M'+(++S.moveSeq),orderId:o.id,sku:n.sku,qty:n.qty,from:S.stock[n.sku].wh2Loc,to:S.stock[n.sku].mainLoc,done:false});made++;}});
 return(made||pendingMoves(o).length)?'move':'ok';
}

/* ---------- status, colors, alerts ---------- */
function status(o){
 const t=now(),f={late:false,pickupMissed:false,pastShip:false,blocked:!!o.blocked},why=[];let level=0;
 if(o.stage===5)return{level:0,why:why,f:f};
 if(o.stage<4){
  const mins=(t-o.stageSince)/MIN,lim=LIMIT[o.stage]*(o.priority?PRIO_FACTOR:1);
  if(mins>lim){f.late=true;level=2;why.push('Delayed: '+fmtMin(mins)+' in '+STAGES[o.stage]+' (limit '+Math.round(lim)+' min)');}
  else if(mins>=lim*AMBER_FRAC){level=1;why.push('Close to the time limit for '+STAGES[o.stage]);}
  const sb=shipBy(o);
  if(o.priority&&sb){const r=(sb-t)/MIN;
   if(r<=0){f.pastShip=true;level=2;why.push('Past its ship-by time ('+hhmm(sb)+')');}
   else if(r<AMBER_SHIPBY){level=Math.max(level,1);why.push('Ship-by '+hhmm(sb)+' is in '+fmtMin(r));}}
 }else{
  if(t>o.pickupAt){f.pickupMissed=true;level=2;why.push('Staged but courier pickup missed ('+cour(o).name+', '+hhmm(o.pickupAt)+')');}
  else if((o.pickupAt-t)/MIN<30){level=1;why.push('Courier pickup in '+fmtMin((o.pickupAt-t)/MIN));}
 }
 if(o.blocked){level=2;why.push('Blocked: no stock');}
 return{level:level,why:why,f:f};
}
function passes(o,f){
 if(f==='all')return true;const s=status(o);
 if(f==='priority')return o.priority;
 if(f==='risk')return o.priority&&o.stage<4&&s.level>0;
 if(f==='delayed')return s.f.late||s.f.pickupMissed;
 if(f==='blocked')return !!o.blocked;
 return true;
}
function cmpCard(a,b){
 if(a.stage===5)return b.stageSince-a.stageSince;
 if(a.priority!==b.priority)return b.priority-a.priority;
 if(a.priority){const x=shipBy(a)===null?Infinity:shipBy(a),y=shipBy(b)===null?Infinity:shipBy(b);if(x!==y)return x-y;}
 return a.stageSince-b.stageSince;
}

/* ---------- warehouse tasks ---------- */
function tasks(){
 const out=[];
 S.orders.forEach(o=>{
  if(o.stage===1){
   if(o.blocked)return;
   const mv=pendingMoves(o);
   if(mv.length)mv.forEach(m=>out.push({key:'move:'+m.id,type:'move',o:o,m:m}));
   else out.push({key:'pick:'+o.id,type:'pick',o:o});
  }else if(o.stage===2)out.push({key:'pick:'+o.id,type:'pick',o:o});
  else if(o.stage===3)out.push({key:(o.packedDone?'stage:':'pack:')+o.id,type:o.packedDone?'stage':'pack',o:o});
 });
 out.sort((a,b)=>{
  if(a.o.priority!==b.o.priority)return b.o.priority-a.o.priority;
  const x=shipBy(a.o)===null?Infinity:shipBy(a.o),y=shipBy(b.o)===null?Infinity:shipBy(b.o);
  if(x!==y)return x-y;
  if(a.o.createdAt!==b.o.createdAt)return a.o.createdAt-b.o.createdAt;
  return a.key<b.key?-1:1;
 });
 return out;
}
function curTask(){
 const l=tasks();let c=S.lock?l.find(t=>t.key===S.lock):null;
 if(!c){S.lock=null;c=l[0]||null;}
 return{c:c,l:l};
}
function nextUnit(o){for(const l of o.lines){if((o.packed[l.sku]||0)<l.qty)return l.sku;}return null;}
function choices(sku){
 const v=V[sku];
 const sib=VL.filter(x=>x.code===v.code&&x.sku!==sku).sort((a,b)=>(a.size===v.size?0:1)-(b.size===v.size?0:1)).slice(0,2);
 const other=VL[(VL.indexOf(v)+9)%VL.length];
 const set=[v].concat(sib);if(set.indexOf(other)<0)set.push(other);
 return set.sort((a,b)=>a.sku<b.sku?-1:1);
}

 if(!v)return fld('Item','Unknown code',true)+fld('Code',raw,true);
 const d=k=>o?v[k]!==o[k]:false;
 return fld('Item',v.name,d('name'))+fld('Color',v.color,d('color'))+fld('Size',v.size,d('size'))+fld('Code',v.sku,true);
}
function wrongHTML(){
 const w=S.wrong,e=V[w.exp],g=V[w.got];
 return '<div class="wrong" role="alertdialog" aria-modal="true" aria-label="Wrong item. Stop."><div class="wx"><div class="wt">WRONG ITEM</div><div class="ws">STOP. Do not pack it.</div>'+
  '<div class="cmp"><div><h4>Expected</h4>'+side(e,g,'',false)+'</div><div><h4>You scanned</h4>'+side(g,e,w.got,true)+'</div></div>'+
  '<p>The office has been told. Put the item back and find the right one.</p><button class="bigbtn light" data-act="dismissWrong">Put it back and try again</button></div></div>';
}
function warehouseHTML(){
 const r=curTask(),c=r.c;
 let h='<main class="wh">';
 if(!c){const nb=S.orders.filter(o=>o.blocked).length;
  h+='<section class="task"><div class="ttype">NO TASKS</div><p class="big">Nothing to do right now.</p><p class="mut">'+(nb?nb+' order'+(nb>1?'s are':' is')+' waiting for the office (no stock).':'Take a short break.')+'</p></section>';}
 else h+=taskHTML(c,r.l);
 h+='</main><div class="reportbar"><button data-act="report">Report a problem</button></div>';
 if(S.wrong)h+=wrongHTML();
 if(S.ui.report){
  h+='<div class="sheet"><div role="dialog" aria-modal="true" aria-label="Report a problem"><h3>What is the problem?</h3>'+(c?'<p class="mut">It will be linked to '+c.o.id+'.</p>':'')+
   REPORT_TYPES.map(x=>'<button class="bigbtn" data-act="reportType" data-t="'+x[1]+'">'+x[0]+'</button>').join('')+'<button class="bigbtn plain" data-act="closeReport">Cancel</button></div></div>';
 }
 return h;
}
function render(){
 const bd=document.querySelector('.board'),sl=bd?bd.scrollLeft:0,y=window.scrollY;
 $app.innerHTML=headerHTML()+(S.ui.view==='office'?officeHTML()+modalHTML():warehouseHTML());
 const b2=document.querySelector('.board');if(b2)b2.scrollLeft=sl;
 window.scrollTo(0,y);
 if(S.scrollTo){const el=document.getElementById(S.scrollTo);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth'});S.scrollTo=null;}
}

/* ---------- events ---------- */
function bind(el){
 const k=el.dataset&&el.dataset.bind;if(!k)return;
 const p=k.split('.');if(p.length===1)S.ui[p[0]]=el.value;else S.ui[p[0]][p[1]]=el.value;
}
document.addEventListener('click',e=>{
 if(e.target.classList&&e.target.classList.contains('ov')){S.ui.modal=null;S.ui.mode=null;render();return;}
 const b=e.target.closest('[data-act]');if(!b)return;
 const f=A[b.dataset.act];if(!f)return;
 f(b.dataset);render();
});
document.addEventListener('input',e=>bind(e.target));
document.addEventListener('change',e=>{bind(e.target);if(e.target.dataset&&e.target.dataset.rr)render();});
document.addEventListener('submit',e=>{
 e.preventDefault();const k=e.target.dataset.form;
 if(k==='issue'){const F=S.ui.form;addIssue({orderId:F.orderId,type:F.type,note:F.note.trim(),by:'Office'});F.note='';toast('Issue added.');}
 else if(k==='mini'){const o=byId(S.ui.modal),M=S.ui.mform;addIssue({orderId:o?o.id:null,type:M.type,note:M.note.trim(),by:'Office'});M.note='';toast('Issue added.');}
 else if(k==='scan'){const inp=e.target.querySelector('input');doScan(inp?inp.value:S.ui.scan);}
 render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.ui.modal||S.ui.report)){S.ui.modal=null;S.ui.mode=null;S.ui.report=false;render();}});
setInterval(()=>{
 const c=document.getElementById('clock');if(c)c.textContent=hhmm(now());
 const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
 render();
},15000);

init('office');
render();
})();
</script>
</body>
</html>
